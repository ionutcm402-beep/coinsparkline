name: Refresh CoinSparkLine signals

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger protected signal refresh
        env:
          REFRESH_URL: ${{ secrets.CSL_REFRESH_URL }}
          CRON_SECRET: ${{ secrets.CSL_CRON_SECRET }}
        run: |
          if [ -z "$REFRESH_URL" ]; then
            echo "Missing repository secret CSL_REFRESH_URL"
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "Missing repository secret CSL_CRON_SECRET"
            exit 1
          fi
          curl --fail-with-body --retry 2 --retry-delay 20 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${REFRESH_URL}?n=30&days=365"
