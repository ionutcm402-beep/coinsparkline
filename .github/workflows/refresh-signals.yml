name: Refresh CoinSparkLine signals

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger protected rolling signal refresh
        env:
          REFRESH_URL: ${{ secrets.CSL_REFRESH_URL }}
          CRON_SECRET: ${{ secrets.CSL_CRON_SECRET }}
        run: |
          if [ -z "$REFRESH_URL" ]; then
            echo "Missing repository secret CSL_REFRESH_URL"
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "Missing repository secret CSL_CRON_SECRET"
            exit 1
          fi

          # Seven hourly slots still cover the top-200 universe, but each slot is
          # split into two 15-asset requests. This keeps each Vercel invocation
          # comfortably below the 60-second function ceiling while preserving the
          # same rolling freshness cadence.
          EPOCH_HOURS=$(( $(date -u +%s) / 3600 ))
          SLOT=$(( EPOCH_HOURS % 7 ))
          BASE_OFFSET=$(( SLOT * 30 ))

          for CHUNK in 0 15; do
            OFFSET=$(( BASE_OFFSET + CHUNK ))
            if [ "$OFFSET" -ge 200 ]; then
              continue
            fi
            curl --fail-with-body --retry 2 --retry-delay 20 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "${REFRESH_URL}?total=200&batch=15&offset=${OFFSET}&days=365"
          done
